name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every step uses globs (static/js/*.js, tests/*.test.mjs, installer/*.sh, ops/*), so a task that adds files never
# edits this workflow. A glob with nothing behind it yet (installer/ before Task 14, ops/ before Task 7) is a no-op
# that says so, never a failure.
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  alpine:
    # The container runs on Alpine's own py3-* packages, so test against exactly those.
    name: pytest (Alpine packages)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      # git so actions/checkout makes a real clone: tests/test_hygiene.py lists files with `git ls-files`.
      # tzdata: ZoneInfo("America/Los_Angeles") needs it, and a bare Alpine has none.
      - run: apk add --no-cache python3 py3-flask py3-gunicorn py3-jwt py3-cryptography py3-pytest sqlite tzdata git
      - uses: actions/checkout@v7
      # The checkout is owned by another user inside the container; git refuses it without this.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 -m pytest -q
      - name: build the installer with busybox sh (once installer/build.sh exists)
        run: |
          if [ -f installer/build.sh ]; then sh installer/build.sh && sh -n dist/setup-hometown.sh
          else echo "no installer/build.sh yet (Task 14)"; fi

  lint:
    name: ruff, node --check and node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install "ruff==0.17.5"
      - run: ruff check
      # The runner's own Node (20 or newer) is enough for a syntax check and the built-in test runner.
      - name: node --check static/js/*.js static/sw.js
        run: |
          shopt -s nullglob
          node --version
          for f in static/js/*.js static/sw.js; do node --check "$f"; done
      - name: node --test tests/*.test.mjs
        run: |
          shopt -s nullglob
          files=(tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "no tests/*.test.mjs"; else node --test "${files[@]}"; fi

  shellcheck:
    name: shellcheck (sh) and the installer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships shellcheck. installer/*.sh arrive with Task 14 and ops/* with Tasks 7, 9 and 14.
      - name: shellcheck -s sh installer/*.sh ops/*
        run: |
          shopt -s nullglob
          files=(installer/*.sh ops/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts yet"; else shellcheck --version && shellcheck -s sh "${files[@]}"; fi
      - name: sh installer/build.sh && sh -n dist/setup-hometown.sh
        run: |
          if [ -f installer/build.sh ]; then sh installer/build.sh && sh -n dist/setup-hometown.sh
          else echo "no installer/build.sh yet (Task 14)"; fi

  ui:
    name: UI smoke (Playwright, Chromium, 412 px)
    runs-on: ubuntu-latest
    env:
      HOMETOWN_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt "playwright==1.65.2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/ui

  mcp:
    name: MCP (requirements-mcp.txt)
    runs-on: ubuntu-latest
    env:
      HOMETOWN_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mcp.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-mcp.txt
      # Until Task 13 adds tests/mcp/test_*.py there is nothing to collect: tests/conftest.py turns pytest's
      # "no tests ran" (exit 5) into a pass for a directory that holds no test files, and only then.
      - run: python -m pytest -q tests/mcp
